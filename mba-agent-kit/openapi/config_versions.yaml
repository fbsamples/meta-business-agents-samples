    delete:
      operationId: deleteConfigRule
      description: 'Remove a rule. The customers it served are served the active version again from the next message of each
        conversation, and the other rules are left as they are. Removing the last rule ends the A/B experiment. To keep a
        version a rule serves instead, set it as the active version, which also ends the experiment.

        '
      summary: 'Remove a rule from the active configuration

        '
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The WhatsApp Business Phone Number ID for the Meta Business Agent.

          '
      - name: rule_id
