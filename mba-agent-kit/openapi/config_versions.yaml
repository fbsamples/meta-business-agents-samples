    post:
      operationId: createConfigRule
      description: 'Serve a configuration version to a share of the customers of this phone number. The phone number keeps
        serving its active version to every customer no rule matches. Each customer falls in one fixed traffic bucket for
        the life of the experiment, and a rule serves the customers whose bucket is in its range. The first rule starts an
        A/B experiment, and later rules join it without moving any customer between buckets. Traffic ranges cannot overlap,
        and the number of rules is limited. To serve named customers instead, such as testers, send `consumer_list_id` without
        a traffic range: the rule serves the members of that consumer list whatever their bucket, and is matched before every
        traffic range. A change takes effect on the next message of each conversation. Edits to the configuration during an
        experiment change the version served outside the rules, and leave the versions the rules serve as they were.'
      summary: Add a rule to the active configuration
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The WhatsApp Business Phone Number ID for the Meta Business Agent.

          '
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
          - 2.0.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BizAIOmniChannelCreateConfigRuleRequest'
      responses:
