openapi: 3.1.1
info:
  title: Connector Tools
  summary: 'Manage tool (endpoint/operation) definitions for a specific connector.

    '
  version: 2.0.0
  description: 'This endpoint provides CRUD operations for managing tool definitions for a specific connector. Tools define
    the individual operations (endpoints) available on an external API, including the canonical outbound request definition
    and user-auth extraction metadata. Each tool must have a descriptive `name` and `description` so the agent knows when
    and how to use it. In the `request_definition`, define the body schema with explicit field types, descriptions, and required
    fields rather than using unstructured objects — the agent uses this schema to extract the correct values from the conversation
    and build valid API requests. Each operation is rate limited separately for each app and `entity_id` pair, to 1,000 requests
    per hour. Once a limit is exhausted, further requests return `429` until the limit resets.

    '
  license:
    name: Meta Business AI Terms of Service
    url: 'https://www.facebook.com/legal/3774714022740775

      '
servers:
- url: https://api.facebook.com/{entity_id}/agent_connectors/{connector_id}/tools
tags:
- name: Business AI
  description: Business AI API operations
- name: Connectors
  description: External API connector management
paths:
  /:
    get:
      operationId: listConnectorTools
      description: 'Retrieve every tool defined on the specified connector. This is the complete set of operations the agent
        can invoke through it.

        '
      summary: List connector tools
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

          '
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          example: 'pfbid02Cx7Rm4TqV9nB3wY6zJkD8sHfA5pLuE1gTaNl

            '
        description: 'The identifier of the parent connector, as returned in the `id` field when the connector was created
          or listed. Pass that value through unchanged.

          '
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
          - 2.0.0
      responses:
        200:
          description: A list of all tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BizAIOmniChannelConnectorToolResponse'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    detail: Invalid parameters
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                NOT_FOUND:
                  value:
                    title: Not Found
                    detail: Resource not found
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                UNAUTHORIZED:
                  value:
                    title: Unauthorized
                    detail: 'Authentication credentials are missing or invalid

                      '
        429:
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                TOO_MANY_REQUESTS:
                  value:
                    title: Too Many Requests
                    detail: Rate limit exceeded
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    title: Internal Server Error
                    detail: An unexpected error occurred
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
      tags:
      - Business AI
      - Connectors
    post:
      operationId: createConnectorTool
      description: 'Create a tool on the specified connector. A tool is one callable operation against the external API the
        connector points at: the connector supplies the base URL and authentication, and the tool supplies the specific request
        to make. During a conversation the agent chooses which tool to invoke based on the tool''s `description`, then builds
        the call from its `request_definition`. A connector with no tools is never invoked.'
      summary: Create a connector tool
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

          '
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          example: 'pfbid02Cx7Rm4TqV9nB3wY6zJkD8sHfA5pLuE1gTaNl

            '
        description: 'The identifier of the parent connector, as returned in the `id` field when the connector was created
          or listed. Pass that value through unchanged.

          '
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
          - 2.0.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BizAIOmniChannelConnectorToolRequest'
      responses:
        201:
          description: The newly created tool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BizAIOmniChannelConnectorToolResponse'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    detail: Invalid parameters
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                NOT_FOUND:
                  value:
                    title: Not Found
                    detail: Resource not found
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                UNAUTHORIZED:
                  value:
                    title: Unauthorized
                    detail: 'Authentication credentials are missing or invalid

                      '
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    detail: 'The access token does not have permission to manage connector tools for this entity

                      '
        429:
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                TOO_MANY_REQUESTS:
                  value:
                    title: Too Many Requests
                    detail: Rate limit exceeded
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    title: Internal Server Error
                    detail: An unexpected error occurred
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
      tags:
      - Business AI
      - Connectors
  /{tool_id}:
