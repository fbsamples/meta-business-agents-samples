openapi: 3.1.1
info:
  title: Agent Configuration Versions
  summary: 'Read the configuration versions of an agent, and set the one it serves.

    '
  version: 2.0.0
  description: 'A configuration version is an immutable snapshot of the knowledge an agent serves: its skills, its business
    information, and its FAQs. Every edit to that knowledge creates a new version, and a phone number serves one version to
    every customer, except the customers the rules of an A/B experiment send to another: a share of traffic, or the members
    of a consumer list. These endpoints list the versions a phone number has served, read one of them, read the one it serves
    now, and set the one it serves. Setting it covers deploying a new version, rolling back to an earlier one, and cloning
    a configuration from another phone number of the same WhatsApp Business Account. A phone number that has not yet been
    migrated to versioned configuration returns an empty list. Each operation is rate limited separately for each app and
    `entity_id` pair, to 1,000 requests per hour. Once a limit is exhausted, further requests return `429` until the limit
    resets.'
  license:
    name: Meta Business AI Terms of Service
    url: 'https://www.facebook.com/legal/3774714022740775

      '
servers:
- url: https://api.facebook.com/{entity_id}/agent_config/versions
tags:
- name: Agent Config
  description: Agent configuration and settings
- name: Business AI
  description: Business AI API operations
paths:
  /:
    get:
      operationId: listConfigVersions
      description: 'List the configuration versions this phone number has served, newest first. This is an activation history,
        so a version that was activated, replaced, and activated again appears once for each activation. A version that the
        phone number rolled past stays in the list and can be made active again. A phone number that has not been migrated
        to versioned configuration returns an empty list rather than an error.

        '
      summary: List configuration versions
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The WhatsApp Business Phone Number ID for the Meta Business Agent.

          '
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: 'If specified, a page of data immediately before this cursor will be returned.

          '
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: 'If specified, a page of data immediately after this cursor will be returned.

          '
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
        description: 'This is the maximum number of objects that may be returned. A query may return fewer than the value
          of limit due to filtering. Do not depend on the number of results being fewer than the limit value to indicate that
          your query reached the end of the list of data, use the absence of next instead. For example, if you set limit to
          10 and 9 results are returned, there may be more data available, but one item was removed due to privacy filtering.
          In all cases, the API returns the correct pagination links.

          '
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
          - 2.0.0
      responses:
        200:
          description: 'A page of configuration versions, newest first

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BizAIOmniChannelConfigVersionSummaryResponse'
                    description: 'This array represents the page of data returned.

                      '
                  paging:
                    type: object
                    properties:
                      cursors:
                        type: object
                        properties:
                          before:
                            type: string
                            description: 'This is the cursor that points to the start of the page of data that has been returned.

                              '
                          after:
                            type: string
                            description: 'This is the cursor that points to the end of the page of data that has been returned.

                              '
                        description: Cursors to the next and previous pages
                      previous:
                        type: string
                        description: 'The API that will return the previous page of data. If not included, this is the first
                          page of data.

                          '
                      next:
                        type: string
                        description: 'The API that will return the next page of data. If not included, this is the last page
                          of data. Due to how pagination works with visibility and privacy, it is possible that a page may
                          be empty but contain a next paging link. Stop paging when the next link no longer appears.

                          '
                    required:
                    - cursors
                    description: Pagination metadata
                required:
                - data
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    detail: Invalid parameters
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                UNAUTHORIZED:
                  value:
                    title: Unauthorized
                    detail: 'Authentication credentials are missing or invalid

                      '
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    detail: Access denied
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                NOT_FOUND:
                  value:
                    title: Not Found
                    detail: Resource not found
        429:
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                TOO_MANY_REQUESTS:
                  value:
                    title: Too Many Requests
                    detail: Rate limit exceeded
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    title: Internal Server Error
                    detail: An unexpected error occurred
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
      tags:
      - Agent Config
      - Business AI
  /active:
    get:
      operationId: getActiveConfigVersion
      description: 'Read the configuration version this phone number serves now, with the version of each kind of knowledge
        it pins. Returns 404 when the phone number has not been migrated to versioned configuration, so a client polling for
        migration gets an unambiguous answer.

        '
      summary: Get the active configuration version
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The WhatsApp Business Phone Number ID for the Meta Business Agent.

          '
      - name: X-API-Version
