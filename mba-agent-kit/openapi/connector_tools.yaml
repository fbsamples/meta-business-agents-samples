              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    title: Internal Server Error
                    detail: An unexpected error occurred
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
      tags:
      - Business AI
      - Connectors
    delete:
      operationId: deleteConnectorTool
      description: 'Delete a tool by its ID. The agent can no longer invoke this operation. The parent connector and its remaining
        tools are unaffected.

        '
      summary: Delete a connector tool
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

          '
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          example: 'pfbid02Cx7Rm4TqV9nB3wY6zJkD8sHfA5pLuE1gTaNl

            '
        description: 'The identifier of the parent connector, as returned in the `id` field when the connector was created
