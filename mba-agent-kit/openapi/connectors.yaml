  /{entity_id}/agent_connectors/{connector_id}/logs:
    get:
      operationId: getConnectorLogs
      description: Retrieve error logs for the connector. Returns individual log entries by default, or aggregated failure
        patterns ranked by occurrence count when summary_only is true. Optionally includes aggregate statistics such as success
        rate and latency percentiles. Only errors originating from the third-party system are included. The time range (end_time
        - start_time) must not exceed 7 days. Logs are available for the last 7 days only.
      summary: List connector error logs
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

          '
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          example: '{connector_id}'
        description: 'The identifier of the connector, as returned in the `id` field when the connector was created or listed.
          Pass that value through unchanged.

          '
      - name: start_time
        in: query
        required: false
        schema:
          type: integer
          example: 1735689600
        description: 'Start of the time range as a Unix timestamp (seconds). Defaults to 24 hours ago. Must be within the
          last 7 days. The time range must not exceed 7 days.

          '
      - name: end_time
        in: query
        required: false
        schema:
          type: integer
          example: 1735776000
        description: 'End of the time range as a Unix timestamp (seconds). Defaults to now (server side). The time range must
          not exceed 7 days.

          '
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          example: 100
        description: 'Maximum number of log entries to return (1-1000). Defaults to 100.

          '
      - name: tool_id
        in: query
        required: false
        schema:
          type: string
          example: '{tool_id}'
        description: 'Optional tool ID to filter logs to a specific operation, as returned in the `id` field when the tool
          was created or listed. Pass that value through unchanged. When omitted, returns logs for all tools on the connector.

          '
      - name: include_stats
        in: query
        required: false
        schema:
          type: boolean
          example: true
        description: 'When true, include aggregate statistics (success rate, latency percentiles, counts) in the response.
          The returned `time_window_seconds` reflects the actual covered window, which may be smaller than your requested
          range if the most recent logs have not yet been processed. Defaults to false.

          '
      - name: summary_only
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: 'When true, return aggregated failure patterns ranked by occurrence count instead of individual log entries.
          Defaults to false.

          '
      - name: top_n
        in: query
        required: false
        schema:
          type: integer
          example: 10
        description: 'Number of top failure patterns to return when summary_only is true (1-50). Defaults to 10.

          '
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
          - 2.0.0
      responses:
        '200':
          description: 'Log entries or failure patterns, with optional statistics

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BizAIOmniChannelConnectorLogStatsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    detail: Invalid parameters
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                NOT_FOUND:
                  value:
                    title: Not Found
                    detail: Resource not found
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                UNAUTHORIZED:
                  value:
                    title: Unauthorized
                    detail: 'Authentication credentials are missing or invalid

                      '
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                TOO_MANY_REQUESTS:
                  value:
                    title: Too Many Requests
                    detail: Rate limit exceeded
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    title: Internal Server Error
                    detail: An unexpected error occurred
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
