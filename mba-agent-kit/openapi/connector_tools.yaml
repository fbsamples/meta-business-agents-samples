              schema:
                $ref: '#/components/schemas/BizAIOmniChannelConnectorToolResponse'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    detail: Invalid parameters
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                NOT_FOUND:
                  value:
                    title: Not Found
                    detail: Resource not found
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                UNAUTHORIZED:
                  value:
                    title: Unauthorized
                    detail: 'Authentication credentials are missing or invalid

                      '
        429:
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                TOO_MANY_REQUESTS:
                  value:
                    title: Too Many Requests
                    detail: Rate limit exceeded
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    title: Internal Server Error
                    detail: An unexpected error occurred
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
      tags:
      - Business AI
      - Connectors
    put:
      operationId: updateConnectorTool
      description: 'Update a tool by its ID. Send the required fields with the values you want the tool to have. Omitting
        `transformation_spec` leaves the stored transformation unchanged; send it as `null` to remove the transformation.

        '
      summary: Update a connector tool
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

          '
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          example: 'pfbid02Cx7Rm4TqV9nB3wY6zJkD8sHfA5pLuE1gTaNl

            '
        description: 'The identifier of the parent connector, as returned in the `id` field when the connector was created
          or listed. Pass that value through unchanged.

          '
      - name: tool_id
        in: path
