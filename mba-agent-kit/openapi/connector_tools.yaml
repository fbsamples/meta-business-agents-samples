security:
- OAuthToken__Authorization: []
components:
  schemas:
    BizAIOmniChannelConnectorToolParameterBinding:
      type: object
      properties:
        kind:
          type: string
          enum:
          - default
          - macro
          example: default
          description: 'Source mode for a Meta Business Agent-owned field.

            '
        value:
          type: string
          nullable: true
          example: Sample item
          description: 'Typed literal value, required when `kind = "default"`; It must be provided as a string, and the underlying
            value must match the node type. It will be converted into the appropriate node type when making toolcalls to the
            underlying endpoint.

            '
        macro:
          type: string
          nullable: true
          enum:
          - WHATSAPP_PHONE_NUMBER
          - WHATSAPP_PHONE_NUMBER_NATIONAL
          - WHATSAPP_IDENTITY_HASH
          - WHATSAPP_CURRENT_STATUS_ID
          - WHATSAPP_BSUID
          - USER_MESSAGE
          - WHATSAPP_CONVERSATION_ID
          - WHATSAPP_MESSAGE_ID
          - INSTAGRAM_IGSID
          - INSTAGRAM_CONVERSATION_ID
          - REQUEST_ID
          example: WHATSAPP_PHONE_NUMBER
          description: 'Registered Meta Business Agent macro ID, required when `kind = "macro"`.

            '
      required:
      - kind
    BizAIOmniChannelConnectorToolParameterNode:
      type: object
      properties:
        type:
          type: string
          enum:
          - string
          - integer
          - number
          - boolean
          example: string
          description: Node type.
        description:
          type: string
          nullable: true
          example: 'The unique identifier of the order to look up.

            '
          description: 'Human-readable documentation for the parameter. Always provide a description — the agent uses it to
            understand what value to extract from the conversation and pass to the API.

            '
        required:
          type: boolean
          nullable: true
          example: true
          description: 'Whether the field is required. This field is ignored for path params, since they are always required.

            '
        binding:
          nullable: true
          example:
            kind: default
            value: Sample item
          description: 'Meta Business Agent-owned binding for this node; omitted means agent/runtime input at the node''s
            canonical path.

            '
          allOf:
          - $ref: '#/components/schemas/BizAIOmniChannelConnectorToolParameterBinding'
      required:
      - type
    BizAIOmniChannelConnectorToolBodyNode:
      type: object
      properties:
        type:
          type: string
          enum:
          - object
          - array
          - string
          - integer
          - number
          - boolean
          example: string
          description: 'Node type. When defining a field that contains structured data, use `object` with explicit `properties`
            rather than `string`. Fully defined schemas allow the agent to extract and pass the correct fields automatically.
            Avoid using `object` without defining its `properties`, as this causes the agent to guess the expected structure.

            '
        description:
          type: string
          nullable: true
          example: The name of the item to create.
          description: 'Human-readable documentation for the field or container. Always provide a description for every node
            — the agent uses it to understand what data each field expects and to extract the right values from the conversation.

            '
        required:
          type: array
          nullable: true
          example:
          - key
          - value
          items:
            type: string
          description: 'Required properties of this object. It can only be provided for "object" type nodes.

            '
        properties:
          type: object
          nullable: true
          example:
            key: '{"type":"string","description":"Property key."}'
            value: '{"type":"string","description":"Property value."}'
          additionalProperties:
            type: string
            description: 'BodyNode element schema for a child field. This field needs to be provided as a string of the BodyNode
              type.

              '
          description: 'Child fields for `object` nodes; keys are canonical outbound field names, value is a string representation
            of the BodyNode type. Only provide when node is of type `object`. Always define explicit properties with their
            types and descriptions instead of leaving an object undefined — the agent needs a fully specified schema to correctly
            populate the request.

            '
        items:
          type: string
          nullable: true
          example: '{"type":"object","description":"Key-value item property.","required":["key","value"],"properties":{"key":"{\"type\":\"string\",\"description\":\"Property
            key.\"}","value":"{\"type\":\"string\",\"description\":\"Property value.\"}"}}'
          description: 'BodyNode element schema for `array` nodes. Only provide when node is of type `array`. This field needs
            to be provided as a string representation of the BodyNode type.

            '
        binding:
          nullable: true
          example:
            kind: default
            value: Sample item
          description: 'Meta Business Agent-owned binding for this node; omitted means agent/runtime input at the node’s canonical
            path. This cannot be provided for an "object" or "array" type node

            '
          allOf:
          - $ref: '#/components/schemas/BizAIOmniChannelConnectorToolParameterBinding'
      required:
      - type
    BizAIOmniChannelConnectorToolRequestBodyDefinition:
      type: object
      properties:
        content_type:
          type: string
          enum:
          - application/json
          example: application/json
          description: 'Request body content type; currently only supports `application/json`

            '
        params:
          type: object
          example:
            name:
              type: string
              description: Item name.
            price:
              type: integer
              description: Item price in cents.
            properties:
              type: array
              description: Custom item properties.
              items: '{"type":"object","description":"Key-value item property.","required":["key","value"],"properties":{"key":"{\"type\":\"string\",\"description\":\"Property
                key.\"}","value":"{\"type\":\"string\",\"description\":\"Property value.\"}"}}'
          additionalProperties:
            $ref: '#/components/schemas/BizAIOmniChannelConnectorToolBodyNode'
          description: 'Top-level JSON body fields; keys are canonical outbound field names.

            '
        required:
          type: array
          nullable: true
