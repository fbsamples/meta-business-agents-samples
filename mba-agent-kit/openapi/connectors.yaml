openapi: 3.1.1
info:
  title: Connectors
  summary: 'Manage connector (API definition) resources for a specific entity.

    '
  version: 2.0.0
  description: 'This endpoint provides CRUD operations for managing connector resources for a specific entity. Connectors
    define external API integrations including protocol, base URL, authentication type, and auth configuration that the AI
    agent can use to interact with third-party services. Supported `auth_type` values are `OAUTH2_CLIENT_CREDENTIALS`, `API_KEY`,
    and `NONE`. Give each connector a descriptive `name` and `description` so the agent understands what the external service
    provides. Each operation is rate limited separately for each app and `entity_id` pair, to 1,000 requests per hour. Once
    a limit is exhausted, further requests return `429` until the limit resets.

    '
  license:
    name: Meta Business AI Terms of Service
    url: 'https://www.facebook.com/legal/3774714022740775

      '
servers:
- url: https://api.facebook.com
tags:
- name: Business AI
  description: Business AI API operations
- name: Connectors
  description: External API connector management
paths:
  /{entity_id}/agent_connectors:
    get:
      operationId: listConnectors
      description: 'Retrieve a list of all connectors for the specified entity

        '
      summary: List connectors
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

          '
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
          - 2.0.0
      responses:
        '200':
          description: A list of all connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BizAIOmniChannelConnectorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    detail: Invalid parameters
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                NOT_FOUND:
                  value:
                    title: Not Found
                    detail: Resource not found
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                UNAUTHORIZED:
                  value:
                    title: Unauthorized
                    detail: 'Authentication credentials are missing or invalid

                      '
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                TOO_MANY_REQUESTS:
                  value:
                    title: Too Many Requests
                    detail: Rate limit exceeded
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    title: Internal Server Error
                    detail: An unexpected error occurred
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
      tags:
      - Business AI
      - Connectors
    post:
      operationId: createConnector
      description: 'Create a new connector for the specified entity. The `name` must be unique among the connectors already
        created for this entity.

        '
      summary: Create a connector
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

