  /{tool_id}/run:
    post:
      operationId: runConnectorTool
      description: 'Execute a tool action. Returns the raw response from the upstream API endpoint. Use this to verify that
        a tool''s request definition and the connector''s credentials work before relying on the agent to invoke the tool
        in a live conversation.

        '
      summary: Run a connector tool
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The Facebook Page ID, WhatsApp Business Phone Number ID or Instagram username for the Meta Business
          Agent.

          '
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          example: 'pfbid02Cx7Rm4TqV9nB3wY6zJkD8sHfA5pLuE1gTaNl

            '
        description: 'The identifier of the parent connector, as returned in the `id` field when the connector was created
          or listed. Pass that value through unchanged.

          '
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
          example: 'pfbid02Wd6Qn3ZtR8mC4xV7yGhK9sJbF1pAuL5eToPl

            '
        description: 'The identifier of the tool, as returned in the `id` field when the tool was created or listed. Pass
          that value through unchanged.

          '
      - name: X-API-Version
        in: header
        required: false
