      - Business AI
  /pending:
    get:
      operationId: getPendingConfigVersion
      description: 'Read the configuration version held for review on a phone number that requires review, with the instructions
        it holds. The agent keeps serving the active configuration version until the review lands. Edits made in WhatsApp
        Manager, in the agent app or through this API are not held: they activate, and the review moves onto them, which `rebase_count`
        counts. Returns 404 when the phone number has no open review.'
      summary: Get the pending configuration version
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The WhatsApp Business Phone Number ID for the Meta Business Agent.

          '
      - name: X-API-Version
