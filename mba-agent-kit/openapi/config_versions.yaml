    patch:
      operationId: updateConfigRule
      description: 'Change the version a rule serves, or its traffic range. A `consumer_pin` rule takes no traffic range,
        and a rule cannot change its type: remove it and add a new one. Omitted fields keep their value, and the other rules
        are left as they are. Customers keep their traffic bucket, so widening a rule only adds customers to it. Sending the
        values the rule already has changes nothing.'
      summary: 'Change a rule of the active configuration

        '
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The WhatsApp Business Phone Number ID for the Meta Business Agent.

          '
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
