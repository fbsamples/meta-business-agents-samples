security:
- OAuthToken__Authorization: []
components:
  schemas:
    BizAIOmniChannelConfigVersionSummaryResponse:
      type: object
      properties:
        version_id:
          type: string
          example: '1234567890'
          description: 'The identifier of the configuration version. Pass this value to set the active version of a phone
            number.

            '
        activated_at:
          type: integer
          example: 1714500000
          description: 'The Unix timestamp when this version became the active version of the phone number.

            '
        activated_by:
          type: string
          example: '1234567890'
          description: 'The identifier of the actor that made this version active. Absent when the actor is not available.

            '
        reason:
          type: string
          enum:
          - clone
          - content_write
          - deploy
          - experiment
          - first_write
          - public_api_write
          - review_apply
          - rollback
          - wa_manager_write
          - weave_write
          example: deploy
          description: 'Why this version became active. `deploy`, `rollback` and `clone` come from the set-active-version
            endpoint. `first_write` is the migration of the phone number onto versioned configuration. `content_write` is
            a configuration edit that created a new version. `review_apply` is a review that landed on a phone number that
            requires review. On such a phone number, `wa_manager_write`, `weave_write` and `public_api_write` are edits the
            business made in WhatsApp Manager, in its agent app, or through the API, which activate without review. `experiment`
            started an A/B experiment or changed its split, and the version listed is the one its default arm serves. Absent
            when the writer declared no reason. More values can be added; handle an unknown value as an edit.

            '
        is_active:
          type: boolean
          example: true
          description: 'Whether this version is the one the phone number serves now.

            '
      required:
      - version_id
      - activated_at
      - is_active
    StandardError:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        type:
          type: string
        status:
          type: integer
      required:
      - title
      - detail
    BizAIOmniChannelConfigVersionKnowledgeResponse:
      type: object
      properties:
        knowledge_type:
          type: string
          enum:
          - business_info
          - faq
          - instructions
          example: instructions
          description: The kind of knowledge this entry pins.
        knowledge_version_id:
          type: string
          example: '1234567890'
          description: 'The identifier of the pinned version of this knowledge type. Compare it between two configuration
            versions to see whether this kind of knowledge changed. It is not a configuration version id, so the set-active-version
            endpoint does not accept it.

            '
        summary:
          type: string
          example: Added an instruction
          description: 'A short description of what changed in this kind of knowledge, generated by the server in English.
            Show it as it is and do not parse it, because its wording can change. A kind of knowledge that this configuration
            version did not change carries the summary of the last change to it. Absent when the writer recorded none.

            '
        created_at:
          type: integer
          example: 1714500000
          description: 'The Unix timestamp when this version of the knowledge type was created.

            '
        created_by:
          type: string
          example: '1234567890'
          description: 'The identifier of the actor that created this version of the knowledge type. Absent when the actor
            is not available.

            '
      required:
      - knowledge_type
      - knowledge_version_id
      - created_at
    BizAIOmniChannelConfigVersionResponse:
      type: object
      properties:
        version_id:
          type: string
          example: '1234567890'
          description: 'The identifier of the configuration version. Pass this value to set the active version of a phone
            number.

            '
        created_at:
          type: integer
          example: 1714500000
          description: 'The Unix timestamp when this configuration version was created.

            '
        created_by:
          type: string
          example: '1234567890'
          description: 'The identifier of the actor that created this configuration version. Absent when the actor is not
            available.

            '
        is_active:
          type: boolean
          example: true
          description: 'Whether this version is the one the phone number serves now.

            '
        knowledge:
          type: array
          items:
            $ref: '#/components/schemas/BizAIOmniChannelConfigVersionKnowledgeResponse'
          description: 'The version of each kind of knowledge that this configuration version pins, one entry for each kind.

            '
      required:
      - version_id
      - created_at
      - is_active
      - knowledge
    BizAIOmniChannelCodeReviewResponse:
      type: object
      properties:
        provider:
          type: string
          enum:
          - meta
          example: meta
          description: 'The system the code review lives in. Read `id` in its terms. New values can be added.

            '
        id:
          type: string
          example: cr-abc123
          description: 'The identifier of the code review in its system. Treat it as opaque.

            '
      required:
      - provider
      - id
    BizAIOmniChannelInstructionsResponse:
      type: object
      properties:
        id:
          type: string
          example: '{instruction_id}'
          description: 'A unique identifier for the instruction. Pass this value unchanged as the `instruction_id` path parameter
            to read, update, or delete the instruction.

            '
        title:
          type: string
          example: Greeting Instructions
          description: 'An optional, human-readable name for the instruction

            '
        description:
          type: string
          example: How the agent should greet customers
          description: 'A description telling the AI when to apply this instruction

            '
        instruction:
          type: string
          example: 'Always greet the customer by name and ask how you can help

            '
          description: 'The body containing the actual instructions for the AI. Has no specific restrictions on structure
            or content.

            '
        channel:
          type: string
          enum:
          - email
          - instagram
          - line
          - messenger
          - sms
          - tiktok
          - unknown
          - webchat
          - whatsapp
          example: WHATSAPP
          description: 'The channel/platform this instruction applies to

            '
        created_at:
          type: integer
          example: 1714500000
          description: 'The timestamp when the instruction was created

            '
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'A map of key-value pairs for additional metadata

            '
        status:
          type: string
          enum:
          - active
          - pending_review
          - blocked
          example: active
          description: 'Whether the agent is applying this instruction. `active` means the instruction passed the automated
            content review. `pending_review` means the review has not finished yet; an instruction read back immediately after
            a create or update is normally in this state. `blocked` means the instruction did not pass the review and the
            agent never applies it — most often because the text asks for or refers to sensitive personal information. Edit
            the instruction to clear the block.

            '
      required:
      - id
      - instruction
      - channel
    BizAIOmniChannelPendingConfigVersionResponse:
      type: object
      properties:
        review_id:
          type: string
          example: '1234567890'
          description: The identifier of the open review.
        version_id:
          type: string
          example: '1234567890'
          description: 'The identifier of the configuration version the phone number serves once the review lands.

            '
        state:
          type: string
          enum:
          - abandoned
          - apply_failed
          - landed
          - open
          example: open
          description: 'Where the review stands. `open` accepts further writes. `apply_failed` means the review was approved
            and the phone number has not moved to it yet; it is retried automatically.

            '
        code_review:
          description: 'The code review that approves the held changes. Absent until the review is opened.

            '
          allOf:
          - $ref: '#/components/schemas/BizAIOmniChannelCodeReviewResponse'
        rebase_count:
          type: integer
          example: 0
          description: 'How many times a change that went live without review, from WhatsApp Manager, its agent app or this
            API, moved the review onto it. Each move posts a new version of the code review.

            '
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/BizAIOmniChannelInstructionsResponse'
          description: 'The instructions the phone number serves once the review lands, in the order the agent reads them.

            '
      required:
      - review_id
      - version_id
      - state
      - rebase_count
      - instructions
    BizAIOmniChannelSetActiveConfigVersionRequest:
      type: object
      properties:
        version_id:
          type: string
          example: '1234567890'
          description: 'The configuration version to serve. It must belong to the same WhatsApp Business Account as the phone
            number.

            '
        reason:
          type: string
          enum:
          - deploy
          - clone
          example: deploy
          description: 'Optional. The server records the move with the reason you send. Without one, it records a `rollback`
            when the phone number served this version before, and a `clone` otherwise.

            '
        expected_active_version_id:
          type: string
          example: '1234567890'
          description: 'The version you believe the phone number serves now. The server checks it and fails the request with
            409 when it does not match, which catches a version that changed since you read it. The check is not atomic: two
            requests that both start from the same version both pass it, and the later one wins. Omit it to overwrite whatever
            is there.'
      required:
      - version_id
    BizAIOmniChannelConfigRuleResponse:
      type: object
      properties:
        rule_id:
          type: string
          example: 1791900000000000-0
          description: 'The identifier of the rule. It stays the same when the rule changes.

            '
        version_id:
          type: string
          example: '1234567890'
          description: 'The configuration version this rule serves.

            '
        type:
          type: string
          enum:
          - traffic_range
          - consumer_pin
          example: traffic_range
          description: 'What the rule matches: `traffic_range` for a share of traffic, or `consumer_pin` for the members of
            a consumer list. Consumer pin rules are matched before every traffic range.'
        consumer_list_id:
          type: string
          nullable: true
          example: '1234567890'
          description: 'The consumer list a `consumer_pin` rule serves. Null for a `traffic_range` rule.

            '
        traffic_start:
          type: integer
          nullable: true
          example: 0
          description: 'The first traffic bucket this rule serves, in basis points. Null for a `consumer_pin` rule.

            '
        traffic_end:
          type: integer
          nullable: true
          example: 1000
          description: 'The bucket after the last one this rule serves, in basis points. Null for a `consumer_pin` rule.

            '
      required:
      - rule_id
      - version_id
      - type
      - consumer_list_id
      - traffic_start
      - traffic_end
    BizAIOmniChannelConfigRulesResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/BizAIOmniChannelConfigRuleResponse'
          description: 'The rules, in the order they are matched. Empty when the phone number runs no experiment.

            '
      required:
      - rules
    BizAIOmniChannelCreateConfigRuleRequest:
      type: object
      properties:
        version_id:
          type: string
          example: '1234567890'
          description: 'The configuration version this rule serves. It must belong to the same WhatsApp Business Account as
            the phone number.

            '
        traffic_start:
          type: integer
          example: 0
          description: 'The first traffic bucket this rule serves, in basis points from 0 to 9999. Each customer of the phone
            number falls in one fixed bucket for the experiment. Send `traffic_start` and `traffic_end` together, or `consumer_list_id`
            alone. Any other combination is rejected with 400.

            '
        traffic_end:
          type: integer
          example: 1000
          description: 'The bucket after the last one this rule serves, in basis points from 1 to 10000. A rule from 0 to
            1000 serves 10% of customers. Sent with `traffic_start`, never with `consumer_list_id`.

            '
        consumer_list_id:
          type: string
          example: '1234567890'
          description: 'A consumer list of this phone number. The rule serves its version to the members of the list, whatever
            their traffic bucket, and is matched before every traffic range. A list can be pinned by one rule at a time. Sent
            alone, never with a traffic range.

            '
      required:
      - version_id
    BizAIOmniChannelUpdateConfigRuleRequest:
      type: object
      properties:
        version_id:
          type: string
          example: '1234567890'
          description: 'The configuration version the rule serves from now on. It must belong to the same WhatsApp Business
            Account as the phone number.

            '
        traffic_start:
          type: integer
          example: 0
          description: 'The first traffic bucket the rule serves from now on, in basis points from 0 to 9999. A `consumer_pin`
            rule takes none.

            '
        traffic_end:
          type: integer
          example: 2000
          description: 'The bucket after the last one the rule serves from now on, in basis points from 1 to 10000. A `consumer_pin`
            rule takes none.

            '
  securitySchemes:
    OAuthToken__Authorization:
      type: http
      scheme: bearer
