  /active/rules:
    get:
      operationId: listConfigRules
      description: 'Read the rules of the configuration this phone number serves: each one with the configuration version
        it serves and its share of traffic or its consumer list, in the order they are matched. `consumer_pin` rules come
        first. `rules` is empty when the phone number runs no A/B experiment. A phone number can have only a few rules, so
        the list is not paginated.'
      summary: 'List the rules of the active configuration

        '
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          example: '123456789012345'
        description: 'The WhatsApp Business Phone Number ID for the Meta Business Agent.

          '
      - name: X-API-Version
        in: header
        required: false
        schema:
          type: string
          enum:
